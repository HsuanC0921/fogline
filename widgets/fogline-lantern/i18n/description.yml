en: "Spotlight for Seelen: apps, open windows, files, settings, quick math, unit conversion and the web from Alt+Space. It reads Seelen's own app list and Windows' search index, keeps no index of its own and only runs while it is open."
ja: "Seelen 向けの Spotlight。Alt+Space でアプリ、開いているウィンドウ、ファイル、設定、簡単な計算、単位換算、Web を検索します。Seelen のアプリ一覧と Windows の検索インデックスを使い、独自のインデックスは持たず、開いている間だけ動作します。"
zh-TW: "Seelen 的 Spotlight：以 Alt+Space 搜尋應用程式、已開啟視窗、檔案、設定、快速計算、單位換算與網頁。直接使用 Seelen 的應用程式清單與 Windows 搜尋索引，不自建索引，只在開啟時執行。"
