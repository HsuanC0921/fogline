id: "@hsuan/fogline-lantern"
icon: LuSearch
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
preset: Popup
instances: Single
lazy: true
html: !include index.html
js: !include index.js
css: !include index.css
shortcuts:
  - id: lantern-open
    command: ["widget", "trigger", "${self.id}"]
    label: Open Fogline Lantern
    defaultKeys: ["Alt", "Space"]
