en: "Control center: Wi-Fi and Bluetooth, Do Not Disturb, screenshot and projection, now playing, display brightness, volume with output device switch, and display options."
ja: "コントロールセンター。Wi-Fi と Bluetooth、おやすみモード、スクリーンショットと投影、再生中の項目、画面の明るさ、出力先の切り替え付き音量、表示設定。"
zh-TW: "控制中心：Wi-Fi 與藍牙、勿擾、截圖與投影、正在播放、螢幕亮度、可切換輸出裝置的音量與顯示選項。"
