id: "@hsuan/fogline-search"
metadata:
  displayName: !extend i18n/display_name.yml
  description: !extend i18n/description.yml
icon: LuSearch
target: "@seelen/fancy-toolbar"
plugin:
  scopes: []
  template: return icon("LuSearch")
  tooltip: |-
    const k = 2; // fogline:lang
    return ["Search apps, files and tools", "アプリ、ファイル、ツールを検索", "搜尋應用程式、檔案與工具"][k] + " · Alt + Space"
  onClickV2: trigger("@hsuan/fogline-lantern")
