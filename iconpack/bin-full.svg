    <rect x="222" y="116" width="68" height="32" rx="16" fill="none" stroke="#fff" stroke-width="14"/>
    <rect x="140" y="140" width="232" height="40" rx="20" fill="url(#white)"/>
  </g>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2"/>
